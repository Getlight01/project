<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Look Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F5F5DC',
                        sand: '#C2B280',
                        olive: '#808000',
                        'dark-green': '#2F4F4F',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-cream min-h-screen">
    <div id="app">
        <!-- Landing Page -->
        <div id="landing-page" class="min-h-screen flex flex-col">
            <header class="bg-dark-green text-cream p-4">
                <div class="container mx-auto flex justify-between items-center">
                    <h1 class="text-2xl font-bold">Fashion Look Generator</h1>
                    <div class="space-x-4">
                        <button onclick="showLogin()" class="hover:underline">Вход</button>
                        <button onclick="showRegister()" class="bg-sand text-dark-green px-4 py-2 rounded hover:bg-olive hover:text-cream transition">Регистрация</button>
                    </div>
                </div>
            </header>
            <main class="flex-1 flex items-center justify-center">
                <div class="text-center p-8">
                    <h2 class="text-4xl font-bold text-dark-green mb-4">Создавай свои образы</h2>
                    <p class="text-olive text-lg mb-8">Загружай вещи, создавай модные образы и сохраняй понравившиеся</p>
                    <button onclick="showRegister()" class="bg-olive text-cream px-8 py-3 rounded-lg text-lg hover:bg-dark-green transition">Начать</button>
                </div>
            </main>
        </div>

        <!-- Login Page -->
        <div id="login-page" class="hidden min-h-screen flex items-center justify-center">
            <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
                <h2 class="text-2xl font-bold text-dark-green mb-6 text-center">Вход</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="mb-4">
                        <label class="block text-olive mb-2">Email</label>
                        <input type="email" id="login-email" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-olive">
                    </div>
                    <div class="mb-6">
                        <label class="block text-olive mb-2">Пароль</label>
                        <input type="password" id="login-password" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-olive">
                    </div>
                    <button type="submit" class="w-full bg-olive text-cream py-2 rounded hover:bg-dark-green transition">Войти</button>
                </form>
                <p class="mt-4 text-center text-olive">
                    Нет аккаунта? <button onclick="showRegister()" class="text-dark-green hover:underline">Регистрация</button>
                </p>
                <button onclick="showLanding()" class="mt-4 text-olive hover:underline block text-center">На главную</button>
            </div>
        </div>

        <!-- Register Page -->
        <div id="register-page" class="hidden min-h-screen flex items-center justify-center">
            <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
                <h2 class="text-2xl font-bold text-dark-green mb-6 text-center">Регистрация</h2>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="mb-4">
                        <label class="block text-olive mb-2">Имя</label>
                        <input type="text" id="register-name" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-olive">
                    </div>
                    <div class="mb-4">
                        <label class="block text-olive mb-2">Email</label>
                        <input type="email" id="register-email" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-olive">
                    </div>
                    <div class="mb-6">
                        <label class="block text-olive mb-2">Пароль</label>
                        <input type="password" id="register-password" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-olive">
                    </div>
                    <button type="submit" class="w-full bg-olive text-cream py-2 rounded hover:bg-dark-green transition">Зарегистрироваться</button>
                </form>
                <p class="mt-4 text-center text-olive">
                    Уже есть аккаунт? <button onclick="showLogin()" class="text-dark-green hover:underline">Вход</button>
                </p>
                <button onclick="showLanding()" class="mt-4 text-olive hover:underline block text-center">На главную</button>
            </div>
        </div>

        <!-- Workshop Page (Main App) -->
        <div id="workshop-page" class="hidden">
            <header class="bg-dark-green text-cream p-4">
                <div class="container mx-auto flex justify-between items-center">
                    <h1 class="text-2xl font-bold">Fashion Look Generator</h1>
                    <div class="flex items-center gap-4">
                        <span id="user-name" class="text-sand"></span>
                        <button onclick="logout()" class="hover:underline">Выход</button>
                    </div>
                </div>
            </header>
            <main class="container mx-auto p-4">
                <!-- Tabs -->
                <div class="flex gap-4 mb-6 border-b border-olive">
                    <button onclick="switchTab('wardrobe')" id="tab-wardrobe" class="px-4 py-2 text-olive border-b-2 border-olive">Гардероб</button>
                    <button onclick="switchTab('looks')" id="tab-looks" class="px-4 py-2 text-olive">Мои образы</button>
                </div>

                <!-- Wardrobe Tab -->
                <div id="wardrobe-tab">
                    <div class="bg-white p-6 rounded-lg shadow mb-6">
                        <h2 class="text-xl font-bold text-dark-green mb-4">Добавить вещь</h2>
                        <div class="flex gap-4 mb-4">
                            <input type="text" id="item-url" placeholder="URL изображения" class="flex-1 p-2 border rounded">
                            <select id="item-part" class="p-2 border rounded">
                                <option value="top">Верх</option>
                                <option value="bottom">Низ</option>
                                <option value="outer">Верхняя одежда</option>
                                <option value="shoes">Обувь</option>
                                <option value="accessory">Аксессуар</option>
                            </select>
                            <button onclick="addItem()" class="bg-olive text-cream px-4 py-2 rounded hover:bg-dark-green">Добавить</button>
                        </div>
                    </div>
                    <div id="wardrobe-items" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <!-- Items will be loaded here -->
                    </div>
                </div>

                <!-- Looks Tab -->
                <div id="looks-tab" class="hidden">
                    <div class="bg-white p-6 rounded-lg shadow mb-6">
                        <h2 class="text-xl font-bold text-dark-green mb-4">Создать образ</h2>
                        <p class="text-olive mb-4">Выберите вещи из гардероба и нажмите "Создать образ"</p>
                        <button onclick="generateLooks()" class="bg-olive text-cream px-6 py-2 rounded hover:bg-dark-green">Создать образ</button>
                    </div>
                    <div id="looks-list" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Looks will be loaded here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let userName = localStorage.getItem('userName');

        // Page navigation
        function showLanding() {
            hideAllPages();
            document.getElementById('landing-page').classList.remove('hidden');
        }

        function showLogin() {
            hideAllPages();
            document.getElementById('login-page').classList.remove('hidden');
        }

        function showRegister() {
            hideAllPages();
            document.getElementById('register-page').classList.remove('hidden');
        }

        function showWorkshop() {
            hideAllPages();
            document.getElementById('workshop-page').classList.remove('hidden');
            document.getElementById('user-name').textContent = userName;
            loadWardrobe();
            loadLooks();
        }

        function hideAllPages() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('register-page').classList.add('hidden');
            document.getElementById('workshop-page').classList.add('hidden');
        }

        // Tab switching
        function switchTab(tab) {
            document.getElementById('tab-wardrobe').classList.remove('border-b-2', 'border-olive');
            document.getElementById('tab-looks').classList.remove('border-b-2', 'border-olive');
            document.getElementById('wardrobe-tab').classList.add('hidden');
            document.getElementById('looks-tab').classList.add('hidden');
            
            document.getElementById('tab-' + tab).classList.add('border-b-2', 'border-olive');
            document.getElementById(tab + '-tab').classList.remove('hidden');
        }

        // Auth functions
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            try {
                const res = await fetch(API_URL + '/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, displayName: name })
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.token;
                    userName = name;
                    localStorage.setItem('token', token);
                    localStorage.setItem('userName', userName);
                    showWorkshop();
                } else {
                    alert(data.error || 'Ошибка регистрации');
                }
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(API_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.token;
                    userName = data.user?.displayName || 'User';
                    localStorage.setItem('token', token);
                    localStorage.setItem('userName', userName);
                    showWorkshop();
                } else {
                    alert(data.error || 'Ошибка входа');
                }
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        function logout() {
            token = null;
            userName = null;
            localStorage.removeItem('token');
            localStorage.removeItem('userName');
            showLanding();
        }

        // Wardrobe functions
        async function loadWardrobe() {
            try {
                const res = await fetch(API_URL + '/api/user-items', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const items = data.items || [];
                
                const container = document.getElementById('wardrobe-items');
                container.innerHTML = items.map(item => `
                    <div class="bg-white p-2 rounded shadow">
                        <img src="${item.thumbnailUrl || item.imageUrl}" alt="Item" class="w-full aspect-square object-cover rounded mb-2">
                        <p class="text-sm text-olive capitalize">${item.part}</p>
                        <button onclick="deleteItem('${item.id}')" class="text-red-500 text-sm hover:underline">Удалить</button>
                    </div>
                `).join('') || '<p class="text-olive">В гардеробе нет вещей</p>';
            } catch (err) {
                console.error(err);
            }
        }

        async function addItem() {
            const url = document.getElementById('item-url').value;
            const part = document.getElementById('item-part').value;
            
            if (!url) {
                alert('Введите URL изображения');
                return;
            }

            try {
                const res = await fetch(API_URL + '/api/add-item-link', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ url, part })
                });
                if (res.ok) {
                    document.getElementById('item-url').value = '';
                    loadWardrobe();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Ошибка добавления');
                }
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        async function deleteItem(id) {
            if (!confirm('Удалить эту вещь?')) return;
            
            try {
                const res = await fetch(API_URL + '/api/item/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    loadWardrobe();
                }
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        // Looks functions
        async function loadLooks() {
            try {
                const res = await fetch(API_URL + '/api/user-looks', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const looks = data.looks || [];
                
                const container = document.getElementById('looks-list');
                container.innerHTML = looks.map(look => `
                    <div class="bg-white p-4 rounded shadow">
                        <img src="${look.renderedUrl || '/looks/placeholder.jpg'}" alt="Look" class="w-full aspect-[2/3] object-cover rounded mb-2">
                        <div class="flex justify-between items-center">
                            <span class="text-olive">Совпадение: ${Math.round((look.score || 0) * 100)}%</span>
                            <div class="flex gap-2">
                                <button onclick="toggleFavorite('${look.id}', ${!look.isFavorite})" class="text-2xl">${look.isFavorite ? '❤️' : '🤍'}</button>
                                <button onclick="toggleSaved('${look.id}', ${!look.isSaved})" class="text-2xl">${look.isSaved ? '💾' : '☆'}</button>
                            </div>
                        </div>
                    </div>
                `).join('') || '<p class="text-olive">Образов пока нет</p>';
            } catch (err) {
                console.error(err);
            }
        }

        async function generateLooks() {
            try {
                const res = await fetch(API_URL + '/api/user-items', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const items = data.items || [];

                if (items.length < 2) {
                    alert('Нужно минимум 2 вещи в гардеробе');
                    return;
                }

                const itemIds = items.slice(0, 5).map(i => i.id);
                
                const genRes = await fetch(API_URL + '/api/generate-looks', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ itemIds })
                });
                
                if (genRes.ok) {
                    loadLooks();
                    switchTab('looks');
                } else {
                    const genData = await genRes.json();
                    alert(genData.error || 'Ошибка генерации');
                }
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        async function toggleFavorite(id, value) {
            try {
                await fetch(API_URL + '/api/look/' + id, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ isFavorite: value })
                });
                loadLooks();
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleSaved(id, value) {
            try {
                await fetch(API_URL + '/api/look/' + id, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ isSaved: value })
                });
                loadLooks();
            } catch (err) {
                console.error(err);
            }
        }

        // Initialize
        if (token) {
            showWorkshop();
        } else {
            showLanding();
        }
    </script>
</body>
</html>
